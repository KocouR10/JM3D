<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" fill="none">
  <!-- Voron 2.4 — pevný rám, pevná podložka, celá gantry stoupá po Z -->
  <rect width="300" height="220" fill="#121824" rx="10"/>
  <g stroke="#bb9af7" stroke-width="2" fill="none">
    <!-- frame: 4 corner extrusions -->
    <line x1="60" y1="190" x2="60" y2="40"/>
    <line x1="240" y1="190" x2="240" y2="40"/>
    <line x1="60" y1="40" x2="240" y2="40"/>
    <line x1="60" y1="190" x2="240" y2="190"/>
    <!-- top frame crossbar (belts idler) -->
    <line x1="60" y1="52" x2="240" y2="52" stroke-opacity="0.5"/>
    <!-- MOVING gantry: X beam + 4 Z columns hint — gantry v horní pozici -->
    <line x1="68" y1="70" x2="232" y2="70" stroke-width="2.5"/>
    <!-- toolhead on X beam -->
    <rect x="145" y="62" width="20" height="24" rx="3"/>
    <path d="M151 86 L159 86 L155 98 Z"/>
    <!-- deployable probe beside nozzle (vysunutý při sondu) -->
    <rect x="166" y="88" width="6" height="10" rx="1" stroke-dasharray="2 2"/>
    <line x1="169" y1="98" x2="169" y2="104" stroke-dasharray="2 2"/>
    <!-- Z lead screws from gantry corners UP through frame -->
    <line x1="70" y1="70" x2="70" y2="52" stroke-dasharray="2 3" stroke-opacity="0.7"/>
    <line x1="230" y1="70" x2="230" y2="52" stroke-dasharray="2 3" stroke-opacity="0.7"/>
    <!-- FIXED bed at bottom (pevná!) -->
    <rect x="85" y="160" width="130" height="6"/>
    <line x1="85" y1="160" x2="85" y2="190" stroke-opacity="0.4"/>
    <line x1="215" y1="160" x2="215" y2="190" stroke-opacity="0.4"/>
    <!-- movement arrow: celá gantry stoupá ↑ -->
    <line x1="150" y1="150" x2="150" y2="115" marker-end="url(#arrUp)" stroke="#4fd6be" stroke-opacity="0.8"/>
  </g>
  <defs>
    <marker id="arrUp" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
      <path d="M0 6 L3 0 L6 6 Z" fill="#4fd6be"/>
    </marker>
  </defs>
  <g fill="#737aa2" font-family="monospace" font-size="8">
    <text x="150" y="205" text-anchor="middle">core-XY · Klipper · vyhřívaná komora</text>
    <text x="150" y="140" text-anchor="middle" fill="#4fd6be">celá gantry stoupá ↑ (Z)</text>
    <text x="150" y="172" text-anchor="middle" fill="#bb9af7">podložka pevná</text>
  </g>
</svg>
